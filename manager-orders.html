<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enclosure Lab | Private Order Manager</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#33363e;--muted:#a9acb5;--accent:#d9a86c;--text:#f5f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em}h1{margin:4px 0;font-size:clamp(26px,4vw,38px)}h2{font-size:19px;margin:0}.muted,p{color:var(--muted)}button,.back{background:var(--accent);color:#21180f;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.panel,.order{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.login{max-width:460px}.field{display:grid;gap:6px;margin:14px 0}.field input{width:100%;padding:12px;border-radius:8px;border:1px solid #454852;background:#101114;color:white}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:var(--muted);min-height:24px}.hidden{display:none!important}.count{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--accent);font-size:12px}.orders{display:grid;grid-template-columns:1fr;gap:14px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.order-id{font-size:11px;color:var(--accent);letter-spacing:.1em;font-weight:800}.order h2{margin:3px 0}.section{border-top:1px solid var(--line);margin-top:17px;padding-top:13px}.section h3{font-size:11px;letter-spacing:.13em;color:var(--accent);margin:0 0 8px}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}.detail{margin:0;overflow-wrap:anywhere}.detail b{color:#fff}.item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.item-title{font-weight:800}.config{white-space:pre-wrap;overflow-wrap:anywhere;color:#c6c8ce;font:12px/1.55 ui-monospace,monospace;margin:8px 0 0}.complete{display:flex;align-items:center;gap:9px;border:1px solid #6e593f;border-radius:9px;padding:10px 13px;color:var(--text);font-weight:800;cursor:pointer}.complete input{width:19px;height:19px;accent-color:#d9a86c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}.tabs button{background:transparent;color:var(--text);border:1px solid var(--line)}.tabs button.active{background:var(--accent);color:#21180f;border-color:var(--accent)}.manage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.manage-grid label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.manage-grid select,.manage-grid input,.manage-grid textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #454852;background:#101114;color:white;font:inherit}.manage-grid textarea{min-height:82px;resize:vertical}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.order-actions button{padding:9px 12px}.fulfilled-label{color:#9fd6a9;font-weight:800}.tabs button:focus-visible,.order-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.empty{padding:35px;text-align:center;color:var(--muted)}.money{font-variant-numeric:tabular-nums}@media(max-width:560px){.wrap{padding:18px 12px 50px}.panel,.order{padding:15px}.order-head{display:grid}.complete{width:100%}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="eyebrow">ENCLOSURE LAB · OWNER ONLY</div><h1>Order Manager</h1><p>Private order dashboard · Manage status, fulfillment, notes, and tracking.</p></div><div class="toolbar"><a class="back" href="https://enclosurelab.github.io/Enclosure-Lab/">← Main Website</a><button class="secondary" id="refresh" type="button">Refresh</button><button class="secondary hidden" id="signout" type="button">Sign out</button></div></header>
<section class="panel login" id="login"><h2>Owner sign in</h2><p>Sign in with the approved owner account.</p><form id="loginForm"><label class="field">Email<input id="email" type="email" autocomplete="username" required value="lawsonhughes53@gmail.com"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section>
<p class="status" id="status" aria-live="polite"></p><section id="ordersSection" class="hidden"><div class="toolbar"><span class="count" id="count">0 active orders</span></div><div class="tabs" role="group" aria-label="Filter orders"><button type="button" class="active" data-filter="active">Active</button><button type="button" data-filter="fulfilled">Fulfilled</button><button type="button" data-filter="all">All orders</button></div><div id="orders" class="orders"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://lblrmljsjimrrighqbdo.supabase.co","sb_publishable_s2YnH1DT5diDmM781NXxqw_gIJVxPRx");
const OWNER="lawsonhughes53@gmail.com", $=id=>document.getElementById(id);let currentUser=null;
function say(message){$("status").textContent=message}
function esc(value){return String(value??"—").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function money(value){return "$"+(Number(value)||0).toFixed(2)}
function row(label,value){return '<p class="detail"><b>'+esc(label)+':</b> '+esc(value==null||value===""?"—":value)+'</p>'}
function configText(value){if(!value||typeof value!=="object")return "No additional configuration";return JSON.stringify(value,null,2)}
const STATUS_OPTIONS=[["new","New order"],["reviewing","Reviewing"],["quoted","Quote sent"],["awaiting_payment","Awaiting payment"],["building","Building"],["ready_for_pickup","Ready for pickup"],["shipped","Shipped"],["fulfilled","Fulfilled"],["cancelled","Cancelled"]];
let allOrders=[],activeFilter="active";
function statusLabel(value){return (STATUS_OPTIONS.find(x=>x[0]===value)||STATUS_OPTIONS[0])[1]}
function orderCard(order){
 const address=order.shipping_address||{},items=Array.isArray(order.items)?order.items:[];
 const itemMarkup=items.map(item=>'<div class="item"><div class="item-title">'+esc((item.name||"Order item")+" × "+(item.quantity||1))+'</div>'+row("Category",item.category)+row("Unit price",item.unit_price==null?"To be confirmed":money(item.unit_price))+row("Line total",item.line_total==null?"To be confirmed":money(item.line_total))+row("Estimated weight",item.estimated_weight_lb==null?"—":item.estimated_weight_lb+" lb")+(item.configuration?'<details><summary>Full enclosure configuration</summary><pre class="config">'+esc(configText(item.configuration))+'</pre></details>':"")+'</div>').join("");
 const status=order.order_status||"new";
 const options=STATUS_OPTIONS.map(([value,label])=>'<option value="'+value+'" '+(status===value?"selected":"")+'>'+label+'</option>').join("");
 return '<article class="order" data-order-card="'+esc(order.id)+'"><div class="order-head"><div><div class="order-id">ORDER '+esc(String(order.id).slice(0,8).toUpperCase())+' · '+esc(new Date(order.created_at).toLocaleString())+'</div><h2>'+esc(order.customer_name)+'</h2><div class="muted">'+esc(order.customer_email)+'</div><div class="muted">Current status: '+esc(statusLabel(status))+'</div></div>'+(status==="fulfilled"?'<span class="fulfilled-label">✓ Fulfilled</span>':'')+'</div><div class="section"><h3>ORDER MANAGEMENT</h3><div class="manage-grid"><label>Status<select data-status>'+options+'</select></label><label>Tracking number<input data-tracking maxlength="120" value="'+esc(order.tracking_number||"")+'" placeholder="Add tracking number"></label><label style="grid-column:1/-1">Private owner notes<textarea data-notes maxlength="4000" placeholder="Internal notes — customers cannot see these">'+esc(order.internal_notes||"")+'</textarea></label></div><div class="order-actions"><button type="button" data-save="'+esc(order.id)+'">Save updates</button>'+(status==="fulfilled"?'':'<button type="button" class="secondary" data-fulfill="'+esc(order.id)+'">✓ Mark fulfilled</button>')+'</div></div><div class="section"><h3>CUSTOMER & FULFILLMENT</h3><div class="details">'+row("Name",order.customer_name)+row("Email",order.customer_email)+row("Phone",order.customer_phone)+row("Fulfillment",order.fulfillment==="pickup"?"Local pickup":"Shipping")+row("Payment preference",order.payment_method)+(order.fulfillment==="shipping"?row("Street",address.street)+row("City",address.city)+row("State",address.state)+row("ZIP",address.zip):"")+'</div></div><div class="section"><h3>ORDER ITEMS & CONFIGURATION</h3>'+itemMarkup+'</div><div class="section"><h3>PRICING SUMMARY · ESTIMATES</h3><div class="details">'+row("Subtotal",money(order.subtotal))+row("Discount",money(order.discount_amount)+(order.discount_code?" ("+order.discount_code+")":""))+row("Estimated tax",money(order.estimated_tax))+row("Estimated shipping",money(order.estimated_shipping))+row("Estimated total",money(order.estimated_total))+'</div><p class="muted">No payment is collected by this order request. Confirm final pricing and payment separately.</p></div><div class="section"><h3>CUSTOMER NOTES</h3><p>'+esc(order.customer_notes||"No additional notes")+'</p></div></article>';
}
function renderOrders(){
 const filtered=allOrders.filter(o=>activeFilter==="all"||(activeFilter==="fulfilled"?["fulfilled","cancelled"].includes(o.order_status):!["fulfilled","cancelled"].includes(o.order_status)));
 const active=allOrders.filter(o=>!["fulfilled","cancelled"].includes(o.order_status)).length;
 $("count").textContent=active+" active · "+allOrders.length+" total";
 $("orders").innerHTML=filtered.length?filtered.map(orderCard).join(""):'<div class="panel empty">No '+(activeFilter==="fulfilled"?"fulfilled":activeFilter==="all"?"":"active ")+'orders to show.</div>';
 document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===activeFilter));
}
async function saveOrder(id,markFulfilled=false){
 const card=document.querySelector('[data-order-card="'+CSS.escape(id)+'"]');if(!card)return;
 const status=markFulfilled?"fulfilled":card.querySelector("[data-status]").value;
 const payload={order_status:status,internal_notes:card.querySelector("[data-notes]").value.trim(),tracking_number:card.querySelector("[data-tracking]").value.trim()||null,completed_at:status==="fulfilled"?new Date().toISOString():null};
 say("Saving order updates…");
 const {error}=await db.from("enclosure_orders").update(payload).eq("id",id);
 if(error){say("Could not save order: "+error.message);return}
 say("Order updated.");await loadOrders();
}
async function checkOwner(){
 const {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;
 if(!currentUser){$("login").classList.remove("hidden");$("ordersSection").classList.add("hidden");$("signout").classList.add("hidden");return false}
 if((currentUser.email||"").toLowerCase()!==OWNER){await db.auth.signOut();currentUser=null;$("login").classList.remove("hidden");$("ordersSection").classList.add("hidden");say("Access denied. This page is restricted to the Enclosure Lab owner.");return false}
 const {data:profile,error}=await db.from("employee_profiles").select("role,approved").eq("user_id",currentUser.id).maybeSingle();
 if(error||!profile||profile.role!=="manager"||profile.approved!==true){await db.auth.signOut();currentUser=null;$("login").classList.remove("hidden");$("ordersSection").classList.add("hidden");say("Access denied: the owner account must have approved manager access.");return false}
 $("login").classList.add("hidden");$("ordersSection").classList.remove("hidden");$("signout").classList.remove("hidden");return true;
}
async function loadOrders(){
 if(!await checkOwner())return;say("Loading orders…");
 const {data,error}=await db.from("enclosure_orders").select("*").order("created_at",{ascending:false});
 if(error){say("Could not load orders. Apply the latest enclosure-orders.sql in Supabase, then refresh. "+error.message);return}
 allOrders=data||[];renderOrders();say("Orders loaded.");
}
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{activeFilter=button.dataset.filter;renderOrders()}));
$("orders").addEventListener("click",async event=>{
 const save=event.target.closest("[data-save]"),fulfill=event.target.closest("[data-fulfill]");
 if(save)await saveOrder(save.dataset.save);
 if(fulfill&&confirm("Mark this order as fulfilled? It will move out of Active orders but remain in order history."))await saveOrder(fulfill.dataset.fulfill,true);
});
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();say("Signing in…");
 const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){say("Sign-in failed: "+error.message);return}
 await loadOrders();
});
$("refresh").addEventListener("click",loadOrders);
$("signout").addEventListener("click",async()=>{await db.auth.signOut();await checkOwner();say("Signed out.")});
db.auth.onAuthStateChange(()=>{setTimeout(loadOrders,0)});
loadOrders();
</script></body></html>
