<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enclosure Lab | Manager Quote Requests</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#33363e;--muted:#a9acb5;--accent:#d9a86c;--text:#f5f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em}h1{margin:4px 0;font-size:clamp(25px,4vw,36px)}p{color:var(--muted)}button{background:var(--accent);color:#21180f;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.panel,.quote{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.quote h2{font-size:19px;margin:0}.quote h3{font-size:13px;color:var(--accent);letter-spacing:.08em;margin:18px 0 6px}.detail{margin:3px 0;overflow-wrap:anywhere}.detail b{color:#fff}.status{color:var(--muted);min-height:24px}.hidden{display:none!important}.empty{padding:26px;text-align:center;color:var(--muted)}a{color:var(--accent)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--accent);font-size:12px}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">ENCLOSURE LAB · PRIVATE</div><h1>Custom quote requests</h1><p>Customer details, equipment specifications, and build requirements.</p></div><div class="toolbar"><button class="secondary" id="refresh" type="button">Refresh</button><button class="secondary hidden" id="signout" type="button">Sign out</button></div></header><section class="panel" id="login"><h2>Manager sign in</h2><p>Sign in with your approved Enclosure Lab manager account.</p><form id="loginForm"><p><label>Email<br><input id="email" type="email" required autocomplete="username" style="width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #454852;background:#101114;color:white"></label></p><p><label>Password<br><input id="password" type="password" required autocomplete="current-password" style="width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #454852;background:#101114;color:white"></label></p><button>Sign in</button></form></section><p class="status" id="status" aria-live="polite"></p><section id="requests" class="hidden"><div class="toolbar"><span class="pill" id="count">0 requests</span></div><div id="list" class="grid"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://lblrmljsjimrrighqbdo.supabase.co','sb_publishable_s2YnH1DT5diDmM781NXxqw_gIJVxPRx');const $=id=>document.getElementById(id);let user=null;
function say(t){$('status').textContent=t}
async function checkManager(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(!user){$('login').classList.remove('hidden');$('requests').classList.add('hidden');$('signout').classList.add('hidden');return false}const {data:p,error}=await db.from('employee_profiles').select('role,approved').eq('user_id',user.id).maybeSingle();if(error||!p||p.role!=='manager'||p.approved!==true){await db.auth.signOut();user=null;$('login').classList.remove('hidden');$('requests').classList.add('hidden');say('Access denied: an approved manager account is required.');return false}$('login').classList.add('hidden');$('requests').classList.remove('hidden');$('signout').classList.remove('hidden');return true}
function val(v){return v===null||v===undefined||v===''?'—':String(v)}
function detail(label,v){return '<p class="detail"><b>'+label+':</b> '+esc(val(v))+'</p>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!await checkManager())return;say('Loading requests…');const {data,error}=await db.from('enclosure_quote_requests').select('*').order('created_at',{ascending:false});if(error){say('Database setup is required before requests can load: '+error.message);return}$('count').textContent=data.length+' request'+(data.length===1?'':'s');$('list').innerHTML=data.length?data.map(q=>'<article class="quote"><div class="eyebrow">'+esc(new Date(q.created_at).toLocaleString())+'</div><h2>'+esc(val(q.name))+'</h2><p><span class="pill">'+esc(val(q.status||'New'))+'</span></p><h3>CUSTOMER</h3>'+detail('Email',q.email)+detail('Phone',q.phone)+'<h3>SUBWOOFER</h3>'+detail('Brand',q.brand)+detail('Model',q.model)+detail('Size',q.size)+detail('Quantity',q.quantity)+detail('RMS',q.rms)+detail('Specs link',q.spec_link)+'<h3>VEHICLE / SPACE</h3>'+detail('Year',q.year)+detail('Make',q.make)+detail('Model',q.vehicle)+detail('Max width',q.max_width)+detail('Max height',q.max_height)+detail('Max depth',q.max_depth)+'<h3>DESIGN</h3>'+detail('Type',q.type)+detail('Goal',q.goal)+detail('Finish',q.finish)+detail('Port',q.port)+detail('Notes',q.notes)+'</article>').join(''):'<div class="panel empty">No quote requests yet.</div>';say('Requests loaded.')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();say('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){say('Sign-in failed: '+error.message);return}await load()});$('refresh').addEventListener('click',load);$('signout').addEventListener('click',async()=>{await db.auth.signOut();await checkManager();say('Signed out.')});db.auth.onAuthStateChange(()=>{setTimeout(load,0)});load();
</script></body></html>
